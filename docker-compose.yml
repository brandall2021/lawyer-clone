services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lawyer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es requerido}
      POSTGRES_DB: lawyer_clone
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawyer -d lawyer_clone"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://lawyer:${POSTGRES_PASSWORD}@postgres:5432/lawyer_clone?sslmode=disable
      PORT: 8080
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      API_ORIGIN: http://api:8080
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
